<div class="min-h-screen bg-neutral-50 text-neutral-900">
  <header class="border-b border-neutral-200 bg-white">
    <div class="mx-auto flex max-w-6xl items-center justify-between px-6 py-4">
      <h1 class="text-xl font-semibold tracking-tight">ClaimDesk</h1>
      @if (auth.user(); as user) {
        <div class="flex items-center gap-4">
          <app-nav [user]="user" [links]="links()" (signOut)="signOut()" />
          <app-notification-bell
            [items]="notifications.items()"
            [unreadCount]="notifications.unreadCount()"
            [failed]="notifications.failed()"
            [selectable]="claimPath() !== null"
            (closed)="notifications.markAllRead()"
            (select)="openClaim($event)"
          />
        </div>
      }
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-6 py-8">
    <router-outlet />
  </main>
  <app-toast-list [toasts]="toasts.toasts()" (dismiss)="toasts.dismiss($event)" />
</div>
